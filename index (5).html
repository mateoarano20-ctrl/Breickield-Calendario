<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>BREICKIELD | Panel de fechas</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050000;--ink:#fff;--mute:#c9b8b8;--red:#e8110c;--deep:#7a0000;--line:rgba(255,255,255,.18);--hd:'Unbounded','Arial Black',sans-serif;--bd:'Montserrat',Arial,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--bd);overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--hd);font-weight:800;line-height:1.1;margin:0}
[hidden]{display:none!important}
@keyframes drift{to{background-position:0 36px}}
@keyframes in{from{opacity:0;transform:translateY(22px)}}
@keyframes flick{0%{opacity:0;filter:blur(8px)}20%{opacity:1}28%{opacity:.2}36%,100%{opacity:1;filter:none}}
@keyframes pulse{50%{transform:scale(1.08);opacity:.55}}
@keyframes slide{from{opacity:0;transform:translateX(-26px)}}
.btn{display:inline-block;background:var(--red);color:#fff;font:800 .8rem var(--hd);padding:15px 24px;border:0;cursor:pointer;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:transform .2s,background .2s}
.btn:hover{background:#fff;color:#000;transform:skewX(-6deg)}
.mini{background:none;border:1px solid var(--line);color:#fff;padding:8px 12px;font:600 .78rem var(--bd);cursor:pointer}.mini:hover{background:#fff;color:#000}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:3px}
input,select,textarea{background:#120000;border:1px solid var(--line);color:#fff;padding:12px;font:400 1rem var(--bd);width:100%}
label{font-size:.78rem;font-weight:600;color:var(--mute);display:grid;gap:6px}
/* login */
#login{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 85% 20%,#b00 0,var(--deep) 30%,var(--bg) 70%)}
#login .ring{position:absolute;right:-14vw;top:50%;width:70vmin;height:70vmin;margin-top:-35vmin;border-radius:50%;border:2px solid rgba(255,60,40,.7);box-shadow:0 0 60px rgba(232,17,12,.6),inset 0 0 60px rgba(232,17,12,.5);animation:pulse 3.2s ease-in-out infinite}
#login img.p{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:50% 62%;opacity:.8;animation:in 1.2s both}
#login::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(5,0,0,.1),rgba(5,0,0,.78))}
#login .ring{display:none}
.box{position:relative;z-index:2;width:min(400px,100%);margin-left:auto;margin-right:max(0px,6vw);display:grid;gap:16px;background:rgba(0,0,0,.72);padding:32px;border:1px solid var(--red);box-shadow:0 0 50px rgba(232,17,12,.3);animation:in .8s .4s both}
.box>img{width:230px;animation:flick 1.6s .6s both}
.box p{margin:0;color:var(--mute);font-size:.9rem}
#err{color:#ff7a70;font-size:.85rem;min-height:1.3em}
/* app */
#app{position:relative;min-height:100vh;background:radial-gradient(80% 50% at 100% 0,#4a0000,transparent 70%)}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line)}
.top img{height:34px}
.wrap{width:min(980px,100% - 40px);margin:0 auto;padding:40px 0 80px}
.next{margin:0 0 34px;animation:in .6s both}
.next h1{font-size:clamp(1.5rem,4.5vw,2.6rem)}
.next p{margin:10px 0 0;color:var(--mute)}
.card{background:rgba(0,0,0,.6);border:1px solid var(--line);padding:24px;margin-bottom:34px}
.card.edit{border-color:var(--red);box-shadow:0 0 36px rgba(232,17,12,.25)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:18px}
form .full{grid-column:1/-1}
.tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.tabs button.on{background:var(--red);border-color:var(--red)}
.tabs .sp{flex:1}
.row{display:grid;grid-template-columns:92px 1fr auto;gap:22px;align-items:center;padding:20px 0;border-top:1px solid var(--line);animation:slide .45s both}
.row:hover .d{color:var(--red)}
.d{font:800 2.2rem/1 var(--hd);transition:color .2s}.d small{display:block;font:600 .72rem var(--bd);margin-top:6px;color:var(--mute)}
.row h3{font-size:1.05rem}.row p{margin:4px 0 0;color:var(--mute);font-size:.9rem}
.row .n{font-size:.85rem;color:#e8d5d5;border-left:2px solid var(--red);padding-left:10px;margin-top:8px}
.row .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.past{opacity:.5}.row.cancel .d,.row.cancel h3{text-decoration:line-through}
.st{font:800 .68rem var(--hd);padding:6px 10px;border:1px solid var(--line)}
.st.ok{background:var(--red);border-color:var(--red)}
.empty{border:1px dashed var(--line);padding:34px;text-align:center;color:var(--mute)}
#msg{font-size:.85rem;color:var(--mute)}
#months{margin:0 0 22px}
.yr{display:flex;align-items:center;gap:14px;margin-bottom:10px;font:800 1.1rem var(--hd)}
.mg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.mb{padding:12px 6px;text-align:center;font-weight:600;color:var(--mute)}
.mb.has{color:#fff;border-color:rgba(232,17,12,.65)}
.mb i{font-style:normal;font-size:.68rem;background:var(--red);color:#fff;border-radius:9px;padding:1px 6px;margin-left:6px}
.mb.on{background:var(--red);border-color:var(--red);color:#fff}
.mh{font:800 .8rem var(--hd);color:var(--mute);margin:28px 0 4px;letter-spacing:.08em;text-transform:uppercase}
.row{cursor:pointer}.row:focus-visible{outline:2px solid #fff;outline-offset:2px}
.row .n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{font-size:.78rem;color:var(--mute)}.row:hover .more{color:#fff}
#dlg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:20px}
.dbox{position:relative;width:min(560px,100%);max-height:90vh;overflow:auto;background:#0b0000;border:1px solid var(--red);box-shadow:0 0 50px rgba(232,17,12,.35);padding:34px 28px;animation:in .3s both}
.dx{position:absolute;top:12px;right:12px}
.dd{color:var(--red);font:800 .72rem var(--hd);text-transform:uppercase;margin-bottom:12px}
.dbox h2{font-size:1.5rem;margin-bottom:8px}.dm{color:var(--mute);margin:0 0 14px}
.dh{font:800 .78rem var(--hd);margin:24px 0 8px;color:var(--mute)}
.dn{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}
@media(max-width:560px){.mg{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){#login::before{background:linear-gradient(rgba(5,0,0,.2),rgba(5,0,0,.8))}.box{margin:0 auto}.row{grid-template-columns:68px 1fr}.row .acts{grid-column:1/-1}.d{font-size:1.7rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://hdyibcjabikmwraflzte.supabase.co','sb_publishable_tyJsdA1DHzo056x_n7_S9Q_SuMXqAZY');
const DB={
  async list(){const {data,error}=await sb.from('shows').select('*').order('date');if(error)throw error;return data},
  async save(it){const {error}=await sb.from('shows').upsert(it);if(error)throw error},
  async saveAll(a){const {error}=await sb.from('shows').upsert(a);if(error)throw error},
  async remove(id){const {error}=await sb.from('shows').delete().eq('id',id);if(error)throw error}
};
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='up',fails=0,lock=0;

/* Solo estos correos pueden crear, editar y borrar. Debe coincidir con las reglas SQL de Supabase. */
const EDITORS=['breickield@gmail.com'];
let canEdit=false;
async function whoami(){
  const {data}=await sb.auth.getSession();
  const em=((data.session&&data.session.user&&data.session.user.email)||'').toLowerCase();
  canEdit=EDITORS.includes(em);
  document.querySelector('.card.edit').hidden=!canEdit;
  $('imlbl').hidden=!canEdit;
  $('role').textContent=canEdit?'EDITOR':'SOLO LECTURA';
  $('role').className='st'+(canEdit?' ok':'');
}
async function show(on){$('login').hidden=on;$('app').hidden=!on;if(on){await whoami();render()}}

$('lf').onsubmit=async e=>{e.preventDefault();
  if(Date.now()<lock){$('err').textContent='Demasiados intentos. Espera unos segundos.';return}
  const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error){fails++;$('err').textContent='Correo o contraseña incorrectos.';if(fails>=5){lock=Date.now()+30000;fails=0}return}
  fails=0;$('err').textContent='';$('pw').value='';show(true)};
$('out').onclick=async()=>{await sb.auth.signOut();show(false)};
sb.auth.getSession().then(({data})=>{if(data.session)show(true)});
sb.auth.onAuthStateChange((ev,s)=>{if(!s)show(false)});
addEventListener('unhandledrejection',()=>say('Error al guardar. Revisa tu conexión y tus permisos.'));

function say(t){$('msg').textContent=t;setTimeout(()=>$('msg').textContent='',3500)}
function reset(){$('f').reset();$('fid').value='';$('fs').textContent='Guardar fecha';$('ft').textContent='Nueva fecha'}
const MES=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let cache=[],yr=new Date().getFullYear(),mo=new Date().getMonth();
const dt=s=>new Date(s.date+'T12:00:00');

function rowHTML(s,past){
  const d=dt(s),mon=d.toLocaleDateString('es-BO',{month:'short'}).toUpperCase();
  return `<div class="row${past?' past':''}${s.status==='Cancelado'?' cancel':''}" data-id="${s.id}" tabindex="0" role="button" aria-label="Ver detalle de ${esc(s.event)}">
  <div class="d">${d.getDate()}<small>${mon} ${d.getFullYear()}</small></div>
  <div><h3>${esc(s.event)}</h3><p>${esc([s.time,s.venue,s.city].filter(Boolean).join(' · '))}</p>${s.notes?`<div class="n">${esc(s.notes)}</div>`:''}</div>
  <div class="acts"><span class="more">Ver detalle ›</span><span class="st${s.status==='Confirmado'?' ok':''}">${esc(s.status||'Pendiente')}</span>${canEdit?`<button class="mini" data-e="${s.id}">Editar</button><button class="mini" data-x="${s.id}">Borrar</button>`:''}</div></div>`}

async function render(){
  let all;try{all=await DB.list()}catch(e){$('list').innerHTML='<div class="empty">No se pudieron cargar las fechas. Revisa la conexión y recarga.</div>';return}all.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  const nw=new Date(),t=nw.getFullYear()+'-'+String(nw.getMonth()+1).padStart(2,'0')+'-'+String(nw.getDate()).padStart(2,'0');cache=all;
  const up=all.filter(s=>s.date>=t&&s.status!=='Cancelado'),isUp=s=>s.date>=t;
  const n=up[0];
  $('next').innerHTML=n?`<h1>Próximo show: ${esc(n.event)}</h1><p>${dt(n).toLocaleDateString('es-BO',{weekday:'long',day:'numeric',month:'long'})} · ${esc(n.city)}. ${up.length} fecha${up.length>1?'s':''} por delante.</p>`:`<h1>Sin shows próximos</h1><p>${canEdit?'Agrega la primera fecha con el formulario.':'Aún no hay fechas cargadas.'}</p>`;
  const pad=n=>String(n).padStart(2,'0'),key=yr+'-'+pad(mo+1),cnt={};all.forEach(s=>{const k=s.date.slice(0,7);cnt[k]=(cnt[k]||0)+1});
  let rows=tab==='up'?all.filter(isUp):tab==='past'?all.filter(s=>!isUp(s)).reverse():tab==='m'?all.filter(s=>s.date.slice(0,7)===key):all;
  $('months').innerHTML=`<div class="yr"><button class="mini" data-y="-1" aria-label="Año anterior">‹</button><span>${yr}</span><button class="mini" data-y="1" aria-label="Año siguiente">›</button></div><div class="mg">`+MES.map((m,i)=>{const c=cnt[yr+'-'+pad(i+1)]||0;return `<button class="mini mb${tab==='m'&&mo===i?' on':''}${c?' has':''}" data-m="${i}">${m}${c?`<i>${c}</i>`:''}</button>`}).join('')+'</div>';
  let out='',last='';rows.forEach(s=>{const k=s.date.slice(0,7);if(k!==last){last=k;out+=`<h3 class="mh">${MESL[+k.slice(5)-1]} ${k.slice(0,4)}</h3>`}out+=rowHTML(s,!isUp(s))});
  $('list').innerHTML=rows.length?out:`<div class="empty">${tab==='m'?'No hay fechas en '+MESL[mo]+' '+yr+'.':'No hay fechas en esta vista.'}</div>`;
  document.querySelectorAll('.tabs [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}
document.querySelectorAll('.tabs [data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
function openDetail(id){const s=cache.find(i=>i.id===id);if(!s)return;const d=dt(s);
  $('dbody').innerHTML=`<div class="dd">${d.toLocaleDateString('es-BO',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h2 id="dt">${esc(s.event)}</h2><p class="dm">${esc([s.time,s.venue,s.city].filter(Boolean).join(' · '))}</p><span class="st${s.status==='Confirmado'?' ok':''}">${esc(s.status||'Pendiente')}</span><h3 class="dh">DESCRIPCIÓN</h3><div class="dn">${s.notes?esc(s.notes):'El artista aún no agregó una descripción.'}</div>`;
  $('dlg').hidden=false;$('dc').focus()}
const closeD=()=>{$('dlg').hidden=true};
$('dc').onclick=closeD;
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeD()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD();if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('row'))openDetail(e.target.dataset.id)});
document.addEventListener('click',e=>{
  const mb=e.target.closest('[data-m]');if(mb){tab='m';mo=+mb.dataset.m;render();return}
  const yb=e.target.closest('[data-y]');if(yb){yr+=+yb.dataset.y;tab='m';render();return}
  const r=e.target.closest('.row');if(r&&!e.target.closest('button'))openDetail(r.dataset.id)});
$('fx').onclick=reset;
$('f').onsubmit=async e=>{e.preventDefault();if(!canEdit)return;const upd=!!$('fid').value;
  await DB.save({id:$('fid').value||'s'+Date.now(),date:$('fd').value,time:$('fh').value,event:$('fe').value.trim(),venue:$('fv').value.trim(),city:$('fc').value.trim(),status:$('fst').value,notes:$('fn').value.trim()});
  say(upd?'Fecha actualizada':'Fecha guardada');reset();render()};
document.addEventListener('click',async e=>{
  if(!canEdit)return;const x=e.target.dataset.x,ed=e.target.dataset.e;
  if(x&&confirm('¿Borrar esta fecha?')){await DB.remove(x);say('Fecha borrada');render()}
  if(ed){const s=(await DB.list()).find(i=>i.id===ed);$('fid').value=s.id;$('fd').value=s.date;$('fh').value=s.time||'';$('fe').value=s.event;$('fv').value=s.venue||'';$('fc').value=s.city;$('fst').value=s.status||'Pendiente';$('fn').value=s.notes||'';$('fs').textContent='Actualizar fecha';$('ft').textContent='Editando fecha';$('f').scrollIntoView({behavior:'smooth',block:'center'})}});
$('ex').onclick=async()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(await DB.list(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='fechas-breickield.json';a.click()};
$('im').onchange=async e=>{try{const a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a))throw 0;await DB.saveAll(a);say('Copia importada');render()}catch(x){say('Archivo no válido')}};
</script>
</body>
</html>
